<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Goôgle</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, sans-serif;
    background: white;
  }
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
  }
  .logo {
    font-size: 90px;
    font-weight: 500;
    margin-bottom: 30px;
    letter-spacing: -2px;
  }
  .logo span:nth-child(1) { color: #4285F4; }
  .logo span:nth-child(2) { color: #EA4335; }
  .logo span:nth-child(3) { color: #FBBC05; }
  .logo span:nth-child(4) { color: #4285F4; }
  .logo span:nth-child(5) { color: #34A853; }
  .logo span:nth-child(6) { color: #EA4335; }
  .search-box {
    width: 550px;
    max-width: 90vw;
    height: 44px;
    border: 1px solid #dfe1e5;
    border-radius: 24px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    box-shadow: none;
    transition: box-shadow 0.2s ease;
  }
  .search-box:hover, .search-box.active {
    box-shadow: 0 1px 6px rgba(32,33,36,0.28);
    border-color: rgba(223,225,229,0);
  }
  .search-box input {
    border: none;
    outline: none;
    flex: 1;
    font-size: 16px;
    background: transparent;
  }
  .search-icon {
    width: 20px;
    height: 20px;
    margin-right: 12px;
    opacity: 0.6;
  }
  .buttons {
    margin-top: 30px;
    display: flex;
    gap: 12px;
  }
  .buttons button {
    background: #f8f9fa;
    border: 1px solid #f8f9fa;
    border-radius: 4px;
    color: #3c4043;
    font-size: 14px;
    padding: 10px 18px;
    cursor: pointer;
  }
  .buttons button:hover {
    box-shadow: 0 1px 1px rgba(0,0,0,0.1);
    border-color: #dadce0;
  }

  /* Geprankt overlay */
  .prank-overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #4285F4, #EA4335, #FBBC05, #34A853);
    background-size: 300% 300%;
    display: none;
    align-items: center;
    justify-content: center;
    animation: gradientMove 3s ease infinite;
  }
  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .prank-text {
    color: white;
    font-size: 80px;
    font-weight: 800;
    text-shadow: 0 4px 20px rgba(0,0,0,0.3);
    animation: pop 0.4s ease;
    text-align: center;
    padding: 0 20px;
  }
  @keyframes pop {
    0% { transform: scale(0.3); opacity: 0; }
    70% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>

  <div class="container" id="mainPage">
    <div class="logo">
      <span>G</span><span>o</span><span>ô</span><span>g</span><span>l</span><span>e</span>
    </div>
    <div class="search-box" id="searchBox">
      <svg class="search-icon" viewBox="0 0 24 24" fill="#4285F4">
        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Zoeken op Google of voer een URL in" autofocus>
    </div>
    <div class="buttons">
      <button id="btn1">Google zoeken</button>
      <button id="btn2">Ik heb geluk</button>
    </div>
  </div>

  <div class="prank-overlay" id="prankOverlay">
    <div class="prank-text">🎉 GEPRANKT! 🎉 - Tobias</div>
  </div>

  <script>
    function showPrank() {
      document.getElementById('mainPage').style.display = 'none';
      document.getElementById('prankOverlay').style.display = 'flex';
    }

    document.getElementById('btn1').addEventListener('click', showPrank);
    document.getElementById('btn2').addEventListener('click', showPrank);
    document.getElementById('searchInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') showPrank();
    });
    document.getElementById('searchBox').addEventListener('focus', () => {
      document.getElementById('searchBox').classList.add('active');
    }, true);
  </script>

</body>
</html>
